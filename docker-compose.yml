services:
  postgres:
    image: pgvector/pgvector:pg16 
    container_name: sd_interview_db
    environment:
      POSTGRES_USER: sd_user
      POSTGRES_PASSWORD: sd_password
      POSTGRES_DB: sd_interview
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
